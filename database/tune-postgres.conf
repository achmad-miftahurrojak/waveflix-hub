# PostgreSQL Production Configuration for WaveFlix Hub
# Optimized for high-performance web application workload

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'

# Memory Settings (adjust based on available RAM)
shared_buffers = 1GB                    # 25% of system RAM
effective_cache_size = 3GB              # 75% of system RAM  
work_mem = 16MB                         # Per query operation
maintenance_work_mem = 256MB            # For VACUUM, CREATE INDEX, etc.
dynamic_shared_memory_type = posix
temp_buffers = 32MB

# Kernel Resource Usage
max_worker_processes = 8
max_parallel_maintenance_workers = 2
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
parallel_leader_participation = on

# Write-Ahead Logging (WAL)
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = on
wal_log_hints = on

# Query Planner
random_page_cost = 1.1                  # For SSD storage
effective_io_concurrency = 200          # For SSD storage
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0644
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB

# What to Log
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_statement = 'mod'                   # Log modifications (INSERT, UPDATE, DELETE)
log_duration = on
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_checkpoints = on
log_connections = on
log_disconnections = on
log_hostname = off

# Performance Monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_activity_query_size = 2048
track_counts = on
track_functions = all
track_io_timing = on

# Autovacuum Settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# Lock Management
deadlock_timeout = 1s
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2

# Connection Pooling (if using pgbouncer)
# These settings work well with connection poolers
idle_in_transaction_session_timeout = 300s
statement_timeout = 300s
lock_timeout = 30s

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# Asynchronous Behavior
effective_io_concurrency = 200
maintenance_io_concurrency = 10
max_worker_processes = 8
backend_flush_after = 256kB
old_snapshot_threshold = -1

# Client Connection Defaults
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# Security
ssl = off                               # Set to 'on' if using SSL
password_encryption = scram-sha-256
row_security = on

# Archive Settings (for backup/replication)
archive_mode = on
archive_command = '/bin/true'           # Replace with actual archive command

# Replication (if setting up replicas)
max_wal_senders = 5
wal_keep_size = 512MB
hot_standby = on
hot_standby_feedback = on

# Statistics
default_statistics_target = 100
constraint_exclusion = partition
cursor_tuple_fraction = 0.1
from_collapse_limit = 8
join_collapse_limit = 8

# Planner Method Configuration
enable_bitmapscan = on
enable_hashagg = on
enable_hashjoin = on
enable_indexscan = on
enable_indexonlyscan = on
enable_material = on
enable_mergejoin = on
enable_nestloop = on
enable_parallel_append = on
enable_parallel_hash = on
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

# JIT (Just-In-Time compilation) - PostgreSQL 11+
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Additional Performance Tunings for Web Applications
# Reduce checkpoint frequency during high load
checkpoint_flush_after = 256kB
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# Optimize for OLTP workload
synchronous_commit = on
fsync = on
full_page_writes = on
wal_sync_method = fdatasync

# Memory usage for sorting and hashing
hash_mem_multiplier = 1.0
logical_decoding_work_mem = 64MB

# Vacuum and maintenance
vacuum_cost_delay = 0
vacuum_cost_limit = 200
vacuum_cleanup_index_scale_factor = 0.1

# Extensions and modules
shared_preload_libraries = 'pg_stat_statements'

# Custom settings for WaveFlix workload
# These can be adjusted based on monitoring data
max_connections = 200                   # Adjust based on connection pooling
shared_buffers = '1GB'                  # 25% of RAM for 4GB system
work_mem = '16MB'                       # Conservative for many connections
maintenance_work_mem = '256MB'          # For index creation, VACUUM
checkpoint_completion_target = 0.9      # Spread checkpoints
wal_buffers = '16MB'                    # WAL buffer size
default_statistics_target = 100         # Statistics for query planner
random_page_cost = 1.1                  # SSD optimization
effective_cache_size = '3GB'            # Available OS cache (75% of RAM)

# Application-specific optimizations
temp_file_limit = -1                    # No limit on temp files
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off