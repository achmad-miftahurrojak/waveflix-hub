# PostgreSQL Production Configuration
# Optimized for WaveFlix Hub production workload

# Memory Configuration
shared_buffers = 256MB                    # 25% of RAM for containers
effective_cache_size = 1GB               # OS cache estimate
work_mem = 4MB                           # Per-query operation memory
maintenance_work_mem = 64MB              # Maintenance operations

# Connection Settings
max_connections = 100                    # Concurrent connections
shared_preload_libraries = 'pg_stat_statements'

# Write-Ahead Logging (WAL) Configuration
wal_buffers = 16MB                       # WAL buffer size
checkpoint_completion_target = 0.7       # Checkpoint completion target
wal_compression = on                     # Compress WAL records

# Query Planner
default_statistics_target = 100          # Statistics target for query planner
random_page_cost = 1.1                  # SSD storage assumption

# Logging Configuration
log_destination = 'stderr'
logging_collector = off
log_statement = 'all'
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Performance Monitoring
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Autovacuum Configuration
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# Checkpoint Configuration
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB

# Archive Configuration (for continuous backup)
archive_mode = on
archive_command = '/scripts/archive_wal.sh %p %f'

# Replication Configuration (for future use)
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB