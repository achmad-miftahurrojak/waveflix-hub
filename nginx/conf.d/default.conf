# Default server configuration for WaveFlix Hub
# This file is included by nginx.conf

# Monitoring and Admin Interface
server {
    listen 9113;
    server_name _;
    
    # Nginx Prometheus Metrics (if nginx-prometheus-exporter is used)
    location /metrics {
        proxy_pass http://nginx-exporter:9113/metrics;
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
}

# WebSocket Support for Real-time Features
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Additional caching rules for TMDB images
server {
    listen 443 ssl http2;
    server_name cdn.${DOMAIN_NAME};
    
    # Use same SSL config as main server
    ssl_certificate /etc/ssl/certs/waveflix.crt;
    ssl_certificate_key /etc/ssl/certs/waveflix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # CDN for TMDB images with aggressive caching
    location /tmdb/ {
        proxy_pass https://image.tmdb.org/;
        proxy_cache image_cache;
        proxy_cache_valid 200 30d;  # 30 days for TMDB images
        proxy_cache_valid 404 1h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000";  # 30 days
        expires 30d;
        
        # Strip sensitive headers
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
    }
    
    # Serve cached images directly
    location /cache/ {
        alias /var/cache/nginx/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# Development/Staging Server (if needed)
server {
    listen 443 ssl http2;
    server_name dev.${DOMAIN_NAME} staging.${DOMAIN_NAME};
    
    ssl_certificate /etc/ssl/certs/waveflix.crt;
    ssl_certificate_key /etc/ssl/certs/waveflix.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Add basic auth for staging
    auth_basic "Staging Area";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    location / {
        proxy_pass http://waveflix_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for staging
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    location /api/ {
        proxy_pass http://waveflix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for staging API
        proxy_cache off;
    }
}