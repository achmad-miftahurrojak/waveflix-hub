# WaveFlix Hub Production Nginx Configuration
# High-performance load balancer with SSL termination, caching, and security

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Buffer Settings
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeout Settings  
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://image.tmdb.org https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Cache Configuration
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=image_cache:50m max_size=2g inactive=7d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=1g inactive=1d use_temp_path=off;

    # Upstream Backend Servers
    upstream waveflix_backend {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=30s weight=1;
        # Add more backend servers for scaling
        # server backend-2:8080 max_fails=3 fail_timeout=30s weight=1;
        # server backend-3:8080 max_fails=3 fail_timeout=30s weight=1;
        
        # Health check (requires nginx-plus or custom module)
        # health_check interval=10s fails=2 passes=2;
        
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Upstream Frontend Servers
    upstream waveflix_frontend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s weight=1;
        # Add more frontend servers for scaling
        # server frontend-2:3000 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 16;
        keepalive_requests 500;
        keepalive_timeout 60s;
    }

    # Health Check Endpoint (Internal)
    server {
        listen 8080;
        server_name _;
        
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.20.0.0/16;  # Docker network
            allow 127.0.0.1;
            deny all;
        }
    }

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS Server
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN_NAME} www.${DOMAIN_NAME};

        # SSL Configuration
        ssl_certificate /etc/ssl/certs/waveflix.crt;
        ssl_certificate_key /etc/ssl/certs/waveflix.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Connection and Rate Limiting
        limit_conn perip 20;
        limit_conn perserver 1000;
        limit_req zone=global burst=50 nodelay;

        # Frontend Application
        location / {
            proxy_pass http://waveflix_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://waveflix_frontend;
                proxy_cache static_cache;
                proxy_cache_valid 200 1d;
                proxy_cache_valid 404 1m;
                add_header X-Cache-Status $upstream_cache_status;
                expires 1d;
            }
        }

        # API Backend with Enhanced Caching
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://waveflix_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API Response Caching
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Cache different endpoints differently
            location ~ ^/api/(trending|homepage|discover) {
                proxy_pass http://waveflix_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 15m;  # 15 minutes for trending content
                proxy_cache_valid 404 1m;
                add_header X-Cache-Status $upstream_cache_status;
            }
            
            location ~ ^/api/(detail|person|images) {
                proxy_pass http://waveflix_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 1h;   # 1 hour for details
                proxy_cache_valid 404 5m;
                add_header X-Cache-Status $upstream_cache_status;
            }
            
            location ~ ^/api/(search) {
                proxy_pass http://waveflix_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 30m;  # 30 minutes for search
                proxy_cache_valid 404 1m;
                add_header X-Cache-Status $upstream_cache_status;
            }
            
            # No cache for auth endpoints
            location ~ ^/api/auth/ {
                limit_req zone=auth burst=10 nodelay;
                proxy_pass http://waveflix_backend;
                proxy_cache off;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # Health Check (Public)
        location /health {
            proxy_pass http://waveflix_backend/health;
            access_log off;
            proxy_cache off;
        }

        # Metrics (Restricted)
        location /metrics {
            proxy_pass http://waveflix_backend/metrics;
            allow 172.20.0.0/16;  # Docker network
            allow 127.0.0.1;
            deny all;
            proxy_cache off;
        }

        # File Uploads
        location /uploads/ {
            proxy_pass http://waveflix_backend;
            proxy_cache image_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
            expires 7d;
        }

        # Security: Block common attack patterns
        location ~ /\. {
            deny all;
            access_log off;
        }
        
        location ~ ~$ {
            deny all;
            access_log off;
        }

        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            return 404 '{"error": "Not Found", "status": 404}';
            add_header Content-Type application/json;
        }
        
        location = /50x.html {
            internal;
            return 500 '{"error": "Internal Server Error", "status": 500}';
            add_header Content-Type application/json;
        }
    }

    # Include additional server configurations
    include /etc/nginx/conf.d/*.conf;
}