apiVersion: apps/v1
kind: Deployment
metadata:
  name: waveflix-backend
  namespace: waveflix
  labels:
    app: waveflix-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: waveflix-backend
  template:
    metadata:
      labels:
        app: waveflix-backend
    spec:
      containers:
      - name: backend
        image: waveflix/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_TYPE
          value: "postgres"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: database-url
        - name: REDIS_URL
          value: "waveflix-redis:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: redis-password
        - name: TMDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: tmdb-api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: jwt-secret
        - name: QUEUE_WORKERS
          value: "10"
        - name: PG_MAX_CONNS
          value: "50"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: waveflix-backend-service
  namespace: waveflix
spec:
  selector:
    app: waveflix-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP