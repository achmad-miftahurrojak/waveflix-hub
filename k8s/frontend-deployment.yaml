apiVersion: apps/v1
kind: Deployment
metadata:
  name: waveflix-frontend
  namespace: waveflix
  labels:
    app: waveflix-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waveflix-frontend
  template:
    metadata:
      labels:
        app: waveflix-frontend
    spec:
      containers:
      - name: frontend
        image: waveflix/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://waveflix-backend-service:8080"
        - name: NEXT_PUBLIC_BACKEND_URL
          value: "https://api.yourdomain.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: waveflix-frontend-service
  namespace: waveflix
spec:
  selector:
    app: waveflix-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP