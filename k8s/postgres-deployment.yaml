apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: waveflix
  labels:
    app: postgres
    tier: database
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9187'
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: init-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              set -e
              echo "Initializing PostgreSQL data directory..."
              if [ ! -d "$PGDATA" ]; then
                mkdir -p "$PGDATA"
                chown -R postgres:postgres "$PGDATA"
                chmod 700 "$PGDATA"
              fi
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15-alpine
          command:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: '--auth-host=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8'
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
            - name: backup-storage
              mountPath: /backups
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
              ephemeral-storage: '1Gi'
            limits:
              memory: '4Gi'
              cpu: '2000m'
              ephemeral-storage: '2Gi'
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

        # PostgreSQL Exporter Sidecar for Prometheus Metrics
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-exporter-dsn
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '100m'
          livenessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
        - name: backup-storage
          persistentVolumeClaim:
            claimName: postgres-backup-pvc

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: waveflix
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: waveflix
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd # Adjust based on your cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: waveflix
data:
  postgresql.conf: |
    # PostgreSQL Production Configuration for WaveFlix Hub

    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    superuser_reserved_connections = 3

    # Memory Settings
    shared_buffers = 1GB                    # 25% of system RAM
    effective_cache_size = 3GB              # 75% of system RAM  
    work_mem = 16MB                         # Per query operation
    maintenance_work_mem = 256MB            # For VACUUM, CREATE INDEX, etc.

    # Checkpoint Settings
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    max_wal_size = 2GB
    min_wal_size = 512MB

    # Query Planner
    random_page_cost = 1.1                  # For SSD storage
    effective_io_concurrency = 200          # For SSD storage

    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%a.log'
    log_truncate_on_rotation = on
    log_rotation_age = 1d
    log_rotation_size = 0
    log_min_duration_statement = 1000       # Log slow queries (>1s)
    log_statement = 'mod'                   # Log modifications
    log_duration = on
    log_lock_waits = on
    log_temp_files = 10MB

    # Performance Monitoring
    shared_preload_libraries = 'pg_stat_statements'
    track_activity_query_size = 2048
    track_counts = on
    track_functions = all

    # Autovacuum Settings
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05

    # Lock Management
    deadlock_timeout = 1s
    max_locks_per_transaction = 64

    # Error Reporting and Logging
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_connections = on
    log_disconnections = on

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: waveflix
  labels:
    app: postgres
    tier: database
spec:
  selector:
    app: postgres
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: waveflix
  labels:
    app: postgres
    tier: database
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: waveflix
  labels:
    app: postgres
    component: backup
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: shared-storage

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: waveflix
  labels:
    app: postgres
data:
  postgresql.conf: |
    # PostgreSQL Production Configuration for WaveFlix Hub

    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    superuser_reserved_connections = 3

    # Memory Settings
    shared_buffers = 1GB                    # 25% of system RAM
    effective_cache_size = 3GB              # 75% of system RAM  
    work_mem = 16MB                         # Per query operation
    maintenance_work_mem = 256MB            # For VACUUM, CREATE INDEX, etc.

    # Checkpoint Settings
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    max_wal_size = 2GB
    min_wal_size = 512MB

    # Query Planner
    random_page_cost = 1.1                  # For SSD storage
    effective_io_concurrency = 200          # For SSD storage

    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%Y-%m-%d.log'
    log_truncate_on_rotation = on
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 1000       # Log slow queries (>1s)
    log_statement = 'mod'                   # Log modifications
    log_duration = on
    log_lock_waits = on
    log_temp_files = 10MB
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_connections = on
    log_disconnections = on

    # Performance Monitoring
    shared_preload_libraries = 'pg_stat_statements'
    track_activity_query_size = 2048
    track_counts = on
    track_functions = all
    track_io_timing = on
    pg_stat_statements.max = 10000
    pg_stat_statements.track = all

    # Autovacuum Settings
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05

    # Background Writer
    bgwriter_delay = 200ms
    bgwriter_lru_maxpages = 100
    bgwriter_lru_multiplier = 2.0

    # Archive Settings (for backup)
    archive_mode = on
    archive_command = '/bin/true'  # Disabled in K8s, handled by backup service
    archive_timeout = 60s

    # Replication Settings (for future use)
    wal_level = replica
    max_wal_senders = 3
    wal_keep_size = 256MB

    # Lock Management
    deadlock_timeout = 1s
    max_locks_per_transaction = 64

    # Security
    ssl = off                               # Handled by service mesh/ingress
    password_encryption = scram-sha-256

  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration File

    # TYPE  DATABASE        USER            ADDRESS                 METHOD

    # "local" is for Unix domain socket connections only
    local   all             all                                     peer

    # IPv4 local connections:
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             0.0.0.0/0               scram-sha-256

    # IPv6 local connections:
    host    all             all             ::1/128                 scram-sha-256

    # Allow replication connections from localhost, by a user with the
    # replication privilege.
    local   replication     all                                     peer
    host    replication     all             127.0.0.1/32            scram-sha-256
    host    replication     all             ::1/128                 scram-sha-256

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: waveflix
  labels:
    app: postgres
data:
  01-init.sql: |
    -- WaveFlix Hub Database Initialization
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";

    -- Create application database if not exists
    SELECT 'CREATE DATABASE waveflix' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'waveflix')\gexec

    -- Create backup user for pg_dump operations
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'backup_user') THEN
            CREATE ROLE backup_user WITH LOGIN PASSWORD 'REPLACE_WITH_STRONG_BACKUP_PASSWORD';
            GRANT CONNECT ON DATABASE waveflix TO backup_user;
            GRANT USAGE ON SCHEMA public TO backup_user;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO backup_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO backup_user;
        END IF;
    END
    $$;

    -- Create monitoring user for metrics
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'monitoring') THEN
            CREATE ROLE monitoring WITH LOGIN PASSWORD 'REPLACE_WITH_STRONG_MONITORING_PASSWORD';
            GRANT CONNECT ON DATABASE waveflix TO monitoring;
            GRANT USAGE ON SCHEMA public TO monitoring;
            GRANT SELECT ON pg_stat_database TO monitoring;
            GRANT SELECT ON pg_stat_user_tables TO monitoring;
            GRANT SELECT ON pg_stat_statements TO monitoring;
        END IF;
    END
    $$;
