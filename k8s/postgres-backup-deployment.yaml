# PostgreSQL Backup Service Deployment for Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backup
  namespace: waveflix
  labels:
    app: postgres-backup
    component: backup
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-backup
  template:
    metadata:
      labels:
        app: postgres-backup
        component: backup
        tier: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: postgres-backup-sa
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: backup-scheduler
        image: waveflix/postgres-backup:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: postgres-db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: backup-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: backup-password
        - name: BACKUP_DIR
          value: "/backups"
        - name: BACKUP_RETENTION_DAYS
          value: "30"
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: s3-bucket
              optional: true
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: s3-access-key
              optional: true
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: s3-secret-key
              optional: true
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: s3-region
              optional: true
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: slack-webhook
              optional: true
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: webhook-url
              optional: true
        - name: BACKUP_SCHEDULE
          value: "0 2 * * *"  # Daily at 2 AM
        - name: HEALTH_CHECK_PORT
          value: "8080"
        ports:
        - name: health-check
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: backup-storage
          mountPath: /backups
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp-storage
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          # Start health check server in background
          /scripts/backup_health_check.sh server &
          
          # Main backup scheduler loop
          echo "Starting PostgreSQL backup scheduler..."
          while true; do
            current_hour=$(date +%H)
            current_minute=$(date +%M)
            
            # Run daily backup at 2 AM
            if [ "$current_hour" = "02" ] && [ "$current_minute" = "00" ]; then
              echo "Starting daily backup at $(date)"
              /scripts/backup_postgres.sh backup daily
              
              # Run weekly backup on Sunday
              if [ "$(date +%u)" = "7" ]; then
                echo "Starting weekly backup at $(date)"
                /scripts/backup_postgres.sh backup weekly
              fi
              
              # Run monthly backup on 1st day of month
              if [ "$(date +%d)" = "01" ]; then
                echo "Starting monthly backup at $(date)"
                /scripts/backup_postgres.sh backup monthly
              fi
              
              # Sleep for 1 hour to avoid repeated runs
              sleep 3600
            else
              # Check every minute
              sleep 60
            fi
          done
      
      # Backup Monitor Sidecar
      - name: backup-monitor
        image: waveflix/postgres-backup:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: postgres-db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: backup-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waveflix-secrets
              key: backup-password
        - name: BACKUP_DIR
          value: "/backups"
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: slack-webhook
              optional: true
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: webhook-url
              optional: true
        volumeMounts:
        - name: backup-storage
          mountPath: /backups
          readOnly: true
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting backup health monitor..."
          while true; do
            /scripts/backup_health_check.sh check
            # Run health check every hour
            sleep 3600
          done
      
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: postgres-backup-pvc
      - name: backup-scripts
        configMap:
          name: backup-scripts
          defaultMode: 0755
      - name: tmp-storage
        emptyDir:
          sizeLimit: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-backup-service
  namespace: waveflix
  labels:
    app: postgres-backup
    component: backup
spec:
  selector:
    app: postgres-backup
  ports:
  - name: health-check
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  namespace: waveflix
  labels:
    app: postgres-backup

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: waveflix
  name: postgres-backup-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-rolebinding
  namespace: waveflix
subjects:
- kind: ServiceAccount
  name: postgres-backup-sa
  namespace: waveflix
roleRef:
  kind: Role
  name: postgres-backup-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: waveflix
  labels:
    app: postgres-backup
data:
  backup_postgres.sh: |
    #!/bin/bash
    # PostgreSQL Backup Script for Kubernetes
    # This script is mounted from ConfigMap and executed by the backup container
    
    # Script content will be copied from the actual backup script
    # For security, the actual script content should be managed separately
    # This is a placeholder that loads the real script
    exec /scripts/backup_postgres.sh "$@"
  
  backup_health_check.sh: |
    #!/bin/bash
    # Backup Health Check Script for Kubernetes
    # This script is mounted from ConfigMap and executed by the backup container
    
    # Script content will be copied from the actual health check script
    # For security, the actual script content should be managed separately
    # This is a placeholder that loads the real script
    exec /scripts/backup_health_check.sh "$@"

---
# CronJob for scheduled backups (alternative to deployment scheduler)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-daily
  namespace: waveflix
  labels:
    app: postgres-backup
    type: daily
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup-job
            type: daily
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
          - name: postgres-backup-daily
            image: waveflix/postgres-backup:latest
            env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: backup-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: backup-password
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_TYPE
              value: "daily"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            - name: backup-scripts
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            command:
            - /scripts/backup_postgres.sh
            - backup
            - daily
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
          - name: backup-scripts
            configMap:
              name: backup-scripts
              defaultMode: 0755

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-weekly
  namespace: waveflix
  labels:
    app: postgres-backup
    type: weekly
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup-job
            type: weekly
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
          - name: postgres-backup-weekly
            image: waveflix/postgres-backup:latest
            env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: backup-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waveflix-secrets
                  key: backup-password
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_TYPE
              value: "weekly"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            - name: backup-scripts
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            command:
            - /scripts/backup_postgres.sh
            - backup
            - weekly
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
          - name: backup-scripts
            configMap:
              name: backup-scripts
              defaultMode: 0755