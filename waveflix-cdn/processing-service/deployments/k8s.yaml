apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: waveflix-cdn
  labels:
    app: processing-service
    component: processing
spec:
  replicas: 5
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
        component: processing
    spec:
      containers:
      - name: processing-service
        image: waveflix/processing-service:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: PORT
          value: "8081"
        - name: WORK_DIR
          value: "/tmp/processing"
        - name: FFMPEG_PATH
          value: "/usr/bin/ffmpeg"
        - name: MAX_CONCURRENT_JOBS
          value: "5"
        - name: REDIS_URL
          value: "redis-service:6379"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: processing-storage
          mountPath: /tmp/processing
        - name: content-storage
          mountPath: /content
          readOnly: true
      volumes:
      - name: processing-storage
        emptyDir:
          sizeLimit: "100Gi"
      - name: content-storage
        persistentVolumeClaim:
          claimName: content-storage-pvc
      nodeSelector:
        workload-type: processing
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - processing-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: processing-service
  namespace: waveflix-cdn
  labels:
    app: processing-service
spec:
  selector:
    app: processing-service
  ports:
  - name: http
    port: 80
    targetPort: 8081
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processing-service-hpa
  namespace: waveflix-cdn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processing-service
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 5
        periodSeconds: 60
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: processing-service-pdb
  namespace: waveflix-cdn
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: processing-service
