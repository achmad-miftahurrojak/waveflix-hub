apiVersion: apps/v1
kind: Deployment
metadata:
  name: hls-service
  namespace: waveflix-cdn
  labels:
    app: hls-service
    component: processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hls-service
  template:
    metadata:
      labels:
        app: hls-service
        component: processing
    spec:
      containers:
      - name: hls-service
        image: waveflix/hls-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: HLS_WORK_DIR
          value: "/tmp/hls"
        - name: FFMPEG_PATH
          value: "/usr/bin/ffmpeg"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: hls-storage
          mountPath: /tmp/hls
      volumes:
      - name: hls-storage
        persistentVolumeClaim:
          claimName: hls-storage-pvc
      nodeSelector:
        workload-type: processing
---
apiVersion: v1
kind: Service
metadata:
  name: hls-service
  namespace: waveflix-cdn
  labels:
    app: hls-service
spec:
  selector:
    app: hls-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hls-storage-pvc
  namespace: waveflix-cdn
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: fast-ssd
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hls-service-hpa
  namespace: waveflix-cdn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hls-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
