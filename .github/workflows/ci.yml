name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: website/backend/go.sum

      - name: Install dependencies
        run: cd website/backend && go mod download

      - name: Run Tests
        run: cd website/backend && go test -v ./...
        env:
          JWT_SECRET: "super-secret-key-minimum-32-characters-long"

  frontend:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/frontend/package-lock.json

      - name: Install dependencies
        run: cd website/frontend && npm ci

      - name: Install Playwright Browsers
        run: cd website/frontend && npx playwright install --with-deps

      - name: Build Next.js
        run: cd website/frontend && npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"

      - name: Run Playwright Tests
        run: cd website/frontend && npm run test:e2e
        env:
          JWT_SECRET: "super-secret-key-minimum-32-characters-long"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: website/frontend/playwright-report/
          retention-days: 30

  build-images:
    name: Build Docker Images (CD Readiness)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./website/backend
          push: false
          tags: waveflix-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./website/frontend
          push: false
          tags: waveflix-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
