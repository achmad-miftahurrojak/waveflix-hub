environment: production

redis:
  url: "" # Set via REDIS_URL environment variable
  password: "" # Set via REDIS_PASSWORD environment variable
  db: 0
  max_retries: 5
  pool_size: 50
  pool_timeout: "30s"
  idle_timeout: "300s"
  default_ttl: "900s"
  enabled: true

postgresql:
  url: "" # Set via DATABASE_URL environment variable
  max_connections: 50
  max_idle_conns: 10
  conn_max_lifetime: "3600s"
  conn_max_idle_time: "300s"
  ssl_mode: "require"

tmdb:
  api_key: "" # Set via TMDB_API_KEY environment variable
  base_url: "https://api.themoviedb.org/3"
  rate_limit: 35
  rate_period: "10s"
  timeout: "15s"
  max_retries: 5
  backoff_base: "2000ms"

http:
  max_idle_conns: 200
  max_idle_conns_per_host: 50
  max_conns_per_host: 100
  idle_conn_timeout: "90s"
  tls_handshake_timeout: "10s"
  response_header_timeout: "15s"
  request_timeout: "30s"

monitoring:
  metrics_interval: "15s"
  history_retention: "168h" # 7 days
  alerting_enabled: true
  dashboard_enabled: true
  dashboard_port: 8080
  metrics_port: 9090

load_testing:
  max_concurrent_users: 1000
  default_duration: "600s"
  ramp_up_duration: "120s"
  metrics_interval: "5s"
  results_retention: "720h" # 30 days