<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WaveFlix Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .offline-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .offline-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .cached-content {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: left;
        }
        
        .cached-content h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }
        
        .cached-content ul {
            list-style: none;
            padding: 0;
        }
        
        .cached-content li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .cached-content a {
            color: white;
            text-decoration: none;
        }
        
        .cached-content a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 1rem;
            }
            
            .offline-title {
                font-size: 1.5rem;
            }
            
            .offline-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        
        <h1 class="offline-title">Kamu Sedang Offline</h1>
        
        <p class="offline-message">
            Tidak bisa terhubung ke internet saat ini. Beberapa konten mungkin masih bisa diakses dari cache browser.
        </p>
        
        <div class="offline-actions">
            <button class="btn" onclick="window.location.reload()">
                🔄 Coba Lagi
            </button>
            
            <a href="/" class="btn">
                🏠 Kembali ke Beranda
            </a>
        </div>
        
        <div class="cached-content" id="cachedContent" style="display: none;">
            <h3>📦 Konten Tersimpan</h3>
            <ul id="cachedList">
                <!-- Cached content will be populated by JavaScript -->
            </ul>
        </div>
    </div>
    
    <script>
        // Check for cached content and display available options
        if ('caches' in window) {
            caches.keys().then(cacheNames => {
                const promises = cacheNames.map(cacheName => 
                    caches.open(cacheName).then(cache => cache.keys())
                );
                
                Promise.all(promises).then(allKeys => {
                    const flatKeys = allKeys.flat();
                    const pageKeys = flatKeys.filter(key => 
                        key.url.includes(location.origin) && 
                        !key.url.includes('/api/') &&
                        !key.url.includes('.js') &&
                        !key.url.includes('.css')
                    );
                    
                    if (pageKeys.length > 0) {
                        const cachedContent = document.getElementById('cachedContent');
                        const cachedList = document.getElementById('cachedList');
                        
                        cachedContent.style.display = 'block';
                        
                        const uniquePages = [...new Set(pageKeys.map(key => {
                            const url = new URL(key.url);
                            return url.pathname;
                        }))];
                        
                        uniquePages.slice(0, 5).forEach(path => {
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = path;
                            a.textContent = path === '/' ? 'Beranda' : 
                                           path.replace(/^\//, '').replace(/\//g, ' › ');
                            li.appendChild(a);
                            cachedList.appendChild(li);
                        });
                    }
                });
            });
        }
        
        // Auto-retry connection every 30 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 30000);
        
        // Listen for online/offline events
        window.addEventListener('online', () => {
            window.location.reload();
        });
        
        window.addEventListener('offline', () => {
            console.log('Device went offline');
        });
        
        // Check connection status
        function checkConnection() {
            return fetch('/api/health', { 
                method: 'HEAD',
                mode: 'no-cors',
                cache: 'no-cache'
            }).then(() => true).catch(() => false);
        }
        
        // Periodic connection check
        setInterval(() => {
            checkConnection().then(isOnline => {
                if (isOnline) {
                    window.location.reload();
                }
            });
        }, 10000);
    </script>
</body>
</html>
